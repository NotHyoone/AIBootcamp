<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" role="img" aria-labelledby="title"><title id="title">버튼 상태 세트</title><defs>
  <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="#c4b5fd" stop-opacity=".56"/><stop offset=".75" stop-color="#bae6fd" stop-opacity=".55"/><stop offset="1" stop-color="#ffd1bd" stop-opacity=".74"/></linearGradient>
  <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7360cc"/></linearGradient>
  <linearGradient id="background" x2="1" y2="1"><stop stop-color="#fce5df"/><stop offset=".5" stop-color="#e5ddfc"/><stop offset="1" stop-color="#cce9f7"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#7567a1" flood-opacity=".22"/></filter>
  <style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#342748}.small{font-size:15px;fill:#655874}.title{font-size:26px;font-weight:700}.label{font-size:17px}</style>
</defs><rect width="640" height="220" rx="28" fill="url(#background)"/><g filter="url(#shadow)"><rect x="20" y="20" width="600" height="180" rx="26" fill="url(#glass)" stroke="white" stroke-opacity=".85" stroke-width="1.5"/></g><text x="44" y="65" class="title">순간을 남기는 작은 동작</text><rect x="42" y="100" width="174" height="46" rx="16" fill="url(#accent)" stroke="white" stroke-opacity=".85" stroke-width="1.5"/><text x="129" y="129" text-anchor="middle" style="font-size:16px;fill:#fff">기록 저장</text><rect x="234" y="100" width="174" height="46" rx="16" fill="url(#glass)" stroke="white" stroke-opacity=".85" stroke-width="1.5"/><text x="321" y="129" text-anchor="middle" style="font-size:16px;fill:#544765">미리보기</text><rect x="426" y="100" width="174" height="46" rx="16" fill="#d8d3e0" stroke="white" stroke-opacity=".85" stroke-width="1.5"/><text x="513" y="129" text-anchor="middle" style="font-size:16px;fill:#544765">사용 불가</text><text x="100" y="178" class="small">기본</text><text x="294" y="178" class="small">보조</text><text x="480" y="178" class="small">비활성</text></svg>
